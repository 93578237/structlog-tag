[project]
name = "structlog-tag"
version = "0.1.0"
description = "Tag-based logging with structlog"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "structlog>=25.5.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.14.0",
    "mypy>=2.1.0",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.15.15",
]
test = [
    "coverage>=7.14.1",
    "dirty-equals>=0.11",
    "inline-snapshot>=0.34.0",
    "pytest>=9.0.3",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if t.TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.mypy]
pretty = true
strict = true
strict_equality_for_none = true
extra_checks = true
warn_unreachable = true
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "unimported-reveal",
  "deprecated",
]

[tool.ruff]
line-length = 88
unsafe-fixes = true

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "CPY", # flake8-copyright
  "D", # pydocstyle
  "PTH", # flake8-use-pathlib
  "DOC", # pydoclint
  "RUF001", "RUF002", "RUF003", "RUF012",
  "SIM105", "SIM108", # flake8-simplify
  "FURB101", # pathlib
  "FURB140", # in 3.12+ comprehensions are faster
  "ANN401", # **kwargs
  "S101", # typing

  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
  "E111", "E114", "E117", "E501", "E203",
  "Q",
  "COM812", "COM819",
  "ISC001", "ISC002",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-row-type = "tuple"
parametrize-values-type = "tuple"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["structlog_tag"]
required-imports = ["from __future__ import annotations"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"
